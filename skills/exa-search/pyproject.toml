[project]
name = "prime-agent-exa-search"
version = "0.1.0"
description = "Minimal Exa web search skill for Prime Agent"
requires-python = ">=3.10"
dependencies = ["httpx>=0.27,<1", "keyring>=25,<27"]

[project.scripts]
exa_search = "rlm.skill:cli"
exa_search_auth = "exa_search.credentials:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/exa_search"]
